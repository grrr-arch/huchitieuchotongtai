<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý & Phân Bổ Hũ Chi Tiêu </title>
    <style>
        :root {
            --primary: #ff758f;
            --primary-hover: #ff4d6d;
            --bg-gradient: linear-gradient(135deg, #ffdde1 0%, #ee9ca7 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-color: #4a3e3d;
            --accent-pink: #fff0f3;
            --border-color: #ffccd5;
            --border-radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 16px;
            color: var(--text-color);
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: var(--border-radius);
            box-shadow: 0 15px 35px rgba(238, 156, 167, 0.3);
            width: 100%;
            max-width: 800px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
        }

        .header h1 {
            color: #c9184a;
            font-size: 1.5rem;
            margin-bottom: 4px;
        }

        .header p {
            color: #805b61;
            font-size: 0.85rem;
        }

        .extractor-card {
            background: #fff;
            padding: 14px;
            border-radius: 12px;
            border: 2px dashed var(--primary);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        textarea {
            width: 100%;
            height: 60px;
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.85rem;
            resize: none;
            outline: none;
        }

        .income-card {
            background: #fff;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .income-card input {
            font-size: 1rem;
            font-weight: bold;
            color: #c9184a;
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            max-width: 200px;
        }

        .jars-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .jars-header h2 {
            font-size: 1.1rem;
            color: #c9184a;
        }

        .btn-add {
            background: #2a9d8f;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .jars-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .jar-item {
            background: #fff;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .jar-item input[type="text"] {
            flex: 2;
            min-width: 130px;
        }

        .jar-item select {
            flex: 1.5;
            min-width: 120px;
        }

        .jar-item input[type="number"] {
            flex: 1;
            min-width: 80px;
        }

        .calculated-amount {
            flex: 1.5;
            min-width: 100px;
            font-weight: bold;
            color: #c9184a;
            text-align: right;
            font-size: 0.9rem;
        }

        input, select {
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            outline: none;
            font-size: 0.85rem;
        }

        .btn-delete {
            background: #ff4d6d;
            color: white;
            border: none;
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
        }

        .summary-box {
            background: var(--accent-pink);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            text-align: center;
        }

        .summary-item {
            background: #fff;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .summary-item .title {
            font-size: 0.75rem;
            color: #a44a5d;
            font-weight: 600;
        }

        .summary-item .val {
            font-size: 1rem;
            font-weight: 800;
            color: #c9184a;
            margin-top: 4px;
        }

        .btn-calc {
            width: 100%;
            padding: 10px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .btn-calc:hover {
            background-color: var(--primary-hover);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🌸 Quản Lý & Phân Bổ Hũ Chi Tiêu 🌸</h1>
        <p>Cấu hình khoản cố định hoặc để AI đề xuất tỷ lệ cho từng hũ</p>
    </div>

    <div class="extractor-card">
        <label><strong>✨ Trích xuất nhanh từ tin nhắn/hóa đơn:</strong></label>
        <textarea id="rawText" placeholder="Dán văn bản tin nhắn hoặc hóa đơn vào đây (Ví dụ: 'Nhan luong 20.000.000d' hoặc 'Tien nha 4.000.000')..."></textarea>
        <button class="btn-calc" onclick="extractInformation()">🔍 Trích Xuất Thông Tin</button>
    </div>

    <div class="income-card">
        <label for="income"><strong>💵 Thu Nhập Hàng Tháng (VNĐ):</strong></label>
        <input type="number" id="income" value="20000000" oninput="calculateJars()">
    </div>

    <div class="jars-header">
        <h2>🏷️ Danh Sách Hũ Chi Tiêu</h2>
        <button class="btn-add" onclick="addCustomJar()">+ Thêm Hũ Chi Tiêu</button>
    </div>

    <div class="jars-container" id="jarsContainer"></div>

    <div class="summary-box">
        <div class="summary-item">
            <div class="title">TỔNG THU NHẬP</div>
            <div class="val" id="displayIncome">0 VNĐ</div>
        </div>
        <div class="summary-item">
            <div class="title">ĐÃ PHÂN BỔ VÀO CÁC HŨ</div>
            <div class="val" id="displayAllocated">0 VNĐ</div>
        </div>
        <div class="summary-item">
            <div class="title">CÒN LẠI DƯ THỪA</div>
            <div class="val" id="displayRemaining">0 VNĐ</div>
        </div>
    </div>
</div>

<script>
    let defaultJars = [
        { name: "Tiền nhà & Hóa đơn", mode: "fixed", val: 4000000 },
        { name: "Tiền ăn uống cố định", mode: "fixed", val: 3000000 },
        { name: "Tiết kiệm phòng thân", mode: "percent", val: 50 },
        { name: "Sở thích & Mua sắm", mode: "percent", val: 30 },
        { name: "Đầu tư & Học tập", mode: "percent", val: 20 }
    ];

    function formatVND(amount) {
        return new Intl.NumberFormat('vi-VN').format(Math.round(amount)) + ' VNĐ';
    }

    function renderJars() {
        const container = document.getElementById('jarsContainer');
        container.innerHTML = '';

        defaultJars.forEach((jar, index) => {
            const jarDiv = document.createElement('div');
            jarDiv.className = 'jar-item';
            jarDiv.innerHTML = `
                <input type="text" value="${jar.name}" onchange="defaultJars[${index}].name = this.value">
                <select onchange="updateMode(${index}, this.value)">
                    <option value="fixed" ${jar.mode === 'fixed' ? 'selected' : ''}>Nhập Cố Định (VNĐ)</option>
                    <option value="percent" ${jar.mode === 'percent' ? 'selected' : ''}>AI Đề Xuất (%)</option>
                </select>
                <input type="number" value="${jar.val}" oninput="updateVal(${index}, this.value)">
                <span class="calculated-amount" id="calc-amount-${index}">0 VNĐ</span>
                <button class="btn-delete" onclick="removeJar(${index})">🗑️</button>
            `;
            container.appendChild(jarDiv);
        });
        calculateJars();
    }

    function updateMode(index, newMode) {
        defaultJars[index].mode = newMode;
        defaultJars[index].val = newMode === 'percent' ? 20 : 1000000;
        renderJars();
    }

    function updateVal(index, newVal) {
        defaultJars[index].val = parseFloat(newVal) || 0;
        calculateJars();
    }

    function addCustomJar() {
        defaultJars.push({ name: "Hũ chi tiêu mới", mode: "percent", val: 10 });
        renderJars();
    }

    function removeJar(index) {
        defaultJars.splice(index, 1);
        renderJars();
    }

    function calculateJars() {
        const income = parseFloat(document.getElementById('income').value) || 0;
        let totalFixed = 0;

        defaultJars.forEach(jar => {
            if (jar.mode === 'fixed') {
                totalFixed += jar.val;
            }
        });

        const remainingAfterFixed = Math.max(0, income - totalFixed);
        let totalAllocated = totalFixed;

        defaultJars.forEach((jar, index) => {
            let finalAmount = 0;
            if (jar.mode === 'fixed') {
                finalAmount = jar.val;
            } else {
                finalAmount = (remainingAfterFixed * jar.val) / 100;
                totalAllocated += finalAmount;
            }

            const calcSpan = document.getElementById(`calc-amount-${index}`);
            if (calcSpan) {
                calcSpan.innerText = formatVND(finalAmount);
            }
        });

        document.getElementById('displayIncome').innerText = formatVND(income);
        document.getElementById('displayAllocated').innerText = formatVND(totalAllocated);
        
        const remainingVal = income - totalAllocated;
        const remainingElem = document.getElementById('displayRemaining');
        remainingElem.innerText = formatVND(remainingVal);
        remainingElem.style.color = remainingVal < 0 ? '#ff3355' : '#c9184a';
    }

    function extractInformation() {
        const text = document.getElementById('rawText').value.toLowerCase();
        if (!text.trim()) {
            alert('Vui lòng dán văn bản tin nhắn/hóa đơn vào ô!');
            return;
        }

        const numberMatches = text.match(/\d+([\.,]\d+)*/g);
        if (!numberMatches) {
            alert('Không tìm thấy số tiền hợp lệ!');
            return;
        }

        let numbers = numberMatches.map(val => {
            let clean = val.replace(/[\.,]/g, '');
            return parseInt(clean, 10);
        }).filter(n => n > 0);

        if (numbers.length > 0) {
            document.getElementById('income').value = Math.max(...numbers);
            calculateJars();
            alert('Đã tự động cập nhật Thu nhập thành công!');
        }
    }

    window.onload = function() {
        renderJars();
    };
</script>

</body>
</html>
